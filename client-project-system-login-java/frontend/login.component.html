<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Project System</h2>
      <p class="login-subtitle">Acesse sua conta corporativa</p>
    </div>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" 
               [(ngModel)]="credentials.username" required class="form-control" placeholder="Digite seu usuário">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" 
               [(ngModel)]="credentials.password" required class="form-control" placeholder="Digite sua senha">
      </div>

      <div *ngIf="errorMessage" class="error-message">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
