<div class="login-container">
  <div class="login-card">
    <h2>Client Project System</h2>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" 
               [(ngModel)]="credentials.username" required class="form-control">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" 
               [(ngModel)]="credentials.password" required class="form-control">
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="!loginForm.form.valid" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
