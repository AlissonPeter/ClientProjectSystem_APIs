<div class="client-form">
    <h2>Cliente</h2>
  
    <form (ngSubmit)="submitForm()">
      <div>
        <label for="name">Nome:</label>
        <input type="text" [(ngModel)]="client.name" name="name" id="name" />
      </div>
      <div class="button-group">
        <button type="submit">Enviar</button>
        <button type="button" (click)="clearForm()">Limpar</button>
      </div>
    </form>
  
    <div *ngIf="submitted">
      <h3>Enviado com sucesso!</h3>
      <p *ngIf="response"><strong>Resposta Servidor:</strong> {{ response }}</p>
    </div>
  
    <app-client-table-selector (clientSelected)="handleSelected($event)"></app-client-table-selector>
  </div>
